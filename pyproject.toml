[project]
name = "insurance-quote-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1,<7.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "djangorestframework-stubs (>=3.18.0,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "black (>=26.5.1,<27.0.0)"
]


[tool.ruff]
target-version = "py314"
exclude = ["*/migrations/*"]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "E", "W"]
ignore = ["RUF012"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations", "__pycache__"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "insurance_quote_service.settings"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.4,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "insurance_quote_service.settings"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=97"
